<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IND.Coin</title>
  <link rel="icon" href="https://i.ibb.co/C38bkf7H/IMG-20250622-032411-164.webp" type="image/png">
  <style>
    html,body{min-height:100vh;width:100vw;margin:0;padding:0;box-sizing:border-box;overflow-x:hidden;background:linear-gradient(120deg,#FFD700 0%,#FFA600 100%);}
    body{font-family:'Segoe UI',Arial,sans-serif;color:#7b5600;}
    #splash-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#FFD700 0%,#FFA600 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10000;}
    @keyframes rotate2d{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
    .fan-image{animation:rotate2d var(--rot-speed,2.8s) linear infinite;position:relative;width:240px;height:240px;border-radius:50%;background-image:url('https://i.ibb.co/C38bkf7H/IMG-20250622-032411-164.webp');background-size:cover;background-position:center;border:5px solid #FFD700;box-shadow:0 6px 22px #FFD70033,0 0 0 16px #fffbe655;transition:box-shadow 0.18s;margin:22px auto 14px;}
    .welcome-photo{width:108px;height:108px;border-radius:50%;margin-bottom:38px;object-fit:cover;background:#fff;box-shadow:0 2px 22px #FFD70099,0 3px 18px #FFA60055,0 0 0 12px #fffbe6cc;}
    .welcome-photo.rotate{animation:rotate2d 1.25s linear infinite;}
    .splash-title-btn{color:#FFD700;letter-spacing:1px;font-size:2.1em;font-weight:800;cursor:pointer;padding:10px 32px;border-radius:16px;transition:background 0.2s,box-shadow 0.2s;box-shadow:0 2px 24px #FFD70033;user-select:none;border:none;background:linear-gradient(90deg,#fffbe6 70%,#FFD700 100%);outline:none;margin-bottom:8px;}
    .splash-title-btn:active,.splash-title-btn:hover{background:linear-gradient(90deg,#FFD700 70%,#FFA600 100%);color:#B07B00;}
    .tab-bar{display:flex;justify-content:space-around;background:linear-gradient(90deg,#FFD700 60%,#FFA600 100%);border-top:2px solid #FFD700;padding:4px 0 2px 0;position:fixed;left:0;bottom:62px;width:100vw;height:62px;z-index:1000;box-shadow:0 -6px 22px #FFD70055,0 2px 22px #fffbe6bb inset;backdrop-filter:blur(3px);}
    .tab-button{background:none;border:none;border-radius:10px;color:#7b5600;font-size:13px;display:flex;flex-direction:column;align-items:center;flex:1;height:58px;font-weight:600;}
    .tab-button.active{background:linear-gradient(90deg,#ffe68c 80%,#FFD700 100%);color:#FFA600;}
    .bar-custom-icon{width:22px;height:22px;border-radius:50%;box-shadow:0 0 8px 2px #FFD700,0 2px 7px #FFA60044;background:#fff;border:2px solid #FFD700;margin-bottom:2px;object-fit:cover;}
    .centered{max-width:480px;margin:0 auto;padding:18px 18px 8px 18px;text-align:center;background:linear-gradient(120deg,#fffbe6cc 60%,#ffd70011 100%);border-radius:18px;}
    .balance-card{margin:18px auto 12px;padding:13px 22px;max-width:310px;font-size:19px;border-radius:14px;background:linear-gradient(90deg,#FFD700 65%,#FFA600 100%);color:#7b5600;font-weight:700;}
    .tfun-btn{background:linear-gradient(120deg,#fffbe6 85%,#FFE066 100%);color:#B07B00;font-size:15px;font-weight:700;padding:11px 28px;border:2.2px solid #FFD700;border-radius:10px;display:flex;align-items:center;gap:7px;cursor:pointer;margin-bottom:7px;}
    .tfun-btn img{filter:grayscale(0) brightness(1) sepia(1) hue-rotate(-30deg) saturate(5) brightness(1.3);}
    .more-options{padding:0 2px;display:flex;flex-direction:column;gap:14px;margin-top:16px;}
    .ind-footer{width:100vw;background:linear-gradient(90deg,#FFD700 70%,#FFA600 100%);color:#7b5600;text-align:center;font-size:15px;padding:16px 0 18px 0;font-weight:700;position:fixed;left:0;bottom:0;z-index:999;letter-spacing:0.3px;box-shadow:0 -2px 10px #FFD70022,0 3px 12px #fffbe6bb inset;pointer-events:none;user-select:none;}
    .footer-logo{width:24px;height:24px;vertical-align:middle;border-radius:50%;margin-left:7px;object-fit:cover;}
    .tab-content{min-height:calc(100vh - 124px);padding:0 0 92px 0;background:linear-gradient(120deg,#FFFBE6 0%,#FFD70011 100%);}
    .button-row{display:flex;flex-wrap:wrap;justify-content:center;gap:13px;margin:20px 0 12px;}
    #invite-success-msg{color:#388e3c;font-weight:bold;font-size:15px;margin:12px 0 0 0;}
    #supportModal,#legalModal,#languageModal,#friendListModal{display:none;position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:999999;background:rgba(0,0,0,0.18);align-items:center;justify-content:center;}
    #supportModal>div,#legalModal>div,#languageModal>div,#friendListModal>div{background:#fffbe6;max-width:340px;width:95vw;border-radius:14px;box-shadow:0 4px 18px #FFD70066;padding:0;display:flex;flex-direction:column;}
    .lang-list{padding:24px 18px 18px 18px;display:flex;flex-direction:column;gap:10px;}
    .lang-item{display:flex;align-items:center;gap:13px;background:#ffe06633;padding:10px 13px;border-radius:8px;cursor:pointer;font-size:16px;transition:background 0.18s;}
    .lang-item.selected,.lang-item:hover{background:linear-gradient(90deg,#FFD700 60%,#FFA600 100%);color:#B07B00;}
    .lang-flag{width:22px;height:22px;border-radius:4px;object-fit:cover;border:1px solid #FFD700;}
    .notif-popup{position:relative;top:0;left:0;right:0;margin:10px auto 0 auto;background:linear-gradient(90deg,#FFD700 80%,#FFA600 100%);color:#7b5600;font-weight:700;font-size:1.08em;padding:10px 24px;border-radius:12px;box-shadow:0 4px 16px #FFD70044;display:none;width:fit-content;max-width:90vw;animation:fadeinout 2.7s;z-index:2;}
    @keyframes fadeinout{0%{opacity:0;}10%{opacity:1;}85%{opacity:1;}100%{opacity:0;}}
    .legal-link-btn{width:100%;margin:8px 0;padding:13px 12px;font-size:17px;font-weight:bold;text-align:center;border-radius:10px;border:2px solid #FFD700;background:linear-gradient(90deg,#FFD700 60%,#FFA600 100%);color:#B07B00;cursor:pointer;transition:background 0.17s;text-decoration:none;display:block;}
    .legal-link-btn:hover{background:linear-gradient(90deg,#FFA600 60%,#FFD700 100%);}
    @media (max-width:650px){.centered,.balance-card{max-width:98vw;}.tab-bar{height:62px;}.ind-footer{font-size:13px;}#supportModal>div,#legalModal>div,#languageModal>div,#friendListModal>div{max-width:98vw;}.notif-popup{font-size:1em;padding:8px 5vw;}.fan-image{width:128px;height:128px;}}
    /* Golden Notification Modal */
    #notificationModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: linear-gradient(120deg,#FFD700 0%,#FFA600 100%);
      color: #7b5600;
      z-index: 999999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: opacity 0.2s;
    }
    #notificationModal.active { display: flex; }
    .notification-content {
      background: linear-gradient(120deg,#fffbe6 80%,#FFD700 100%);
      border-radius: 16px;
      padding: 24px 32px;
      box-shadow: 0 6px 32px #FFD70033, 0 0 0 4px #fffbe655;
      max-width: 96vw; max-height: 90vh;
      overflow-y: auto; text-align: center;
      border: 3px solid #FFA600;
    }
    .notification-content h2 { color: #B07B00; margin-top: 0; }
    .notification-list { margin: 18px 0; text-align: left;}
    .notification-list li { margin-bottom: 10px; font-size: 17px; color: #B07B00; }
    .notif-close-btn {
      margin-top: 18px; padding: 10px 32px;
      background: linear-gradient(90deg,#FFD700 70%,#FFA600 100%);
      color: #B07B00; border: none; border-radius: 8px;
      font-weight: bold; font-size: 17px; cursor: pointer;
      transition: background 0.2s;
    }
    .notif-close-btn:hover { background: linear-gradient(90deg,#FFA600 80%,#FFD700 100%);}
    @media (max-width:650px){
      .notification-content { padding: 12px 5vw; }
    }
    /* Big Notification Label */
    #notificationTap {
      font-size:2.3em;
      font-weight:900;
      color:#FFD700;
      letter-spacing:0.06em;
      margin:18px 0 0 0;
      cursor:pointer;
      text-shadow:0 2px 10px #fffbe6bb,0 2px 4px #B07B0070;
      background: none;
      border: none;
      outline: none;
      display: inline-block;
      line-height: 1.1;
      transition: color 0.2s;
      user-select: none;
    }
    #notificationTap:hover { color: #FFA600; }
  </style>
</head>

<script>
const LANGUAGES = [
  {code:"en", name:"English",   flag:"us.svg"},
  {code:"hi", name:"हिन्दी",     flag:"in.svg"},
  {code:"es", name:"Español",   flag:"es.svg"},
  {code:"fr", name:"Français",  flag:"fr.svg"},
  {code:"de", name:"Deutsch",   flag:"de.svg"},
  {code:"zh", name:"中文",       flag:"cn.svg"},
  {code:"ar", name:"العربية",   flag:"sa.svg"},
  {code:"ru", name:"Русский",   flag:"ru.svg"},
  {code:"ja", name:"日本語",    flag:"jp.svg"},
  {code:"tr", name:"Türkçe",    flag:"tr.svg"},
  {code:"pt", name:"Português", flag:"pt.svg"},
  {code:"bn", name:"বাংলা",     flag:"bd.svg"},
  {code:"id", name:"Bahasa Indonesia", flag:"id.svg"},
  {code:"ko", name:"한국어",    flag:"kr.svg"},
  {code:"vi", name:"Tiếng Việt", flag:"vn.svg"},
  {code:"fa", name:"فارسی",      flag:"ir.svg"},
];
const TRANSLATIONS = {
  en: {
    home: "Home", more: "More", powered: "Powered by", claim: "Claim", boost: "Boost", language: "Language",
    invite: "Invite Friend", myid: "My ID", support: "Support", legal: "Legal Info", selectLanguage: "Select Language",
    hashrate: "Hashrate", userid: "Your user ID", contactSupport: "Contact Support", legalInfo: "Legal Info",
    send: "Send"
  }
};
function getLangObj(code) { return TRANSLATIONS[code] || TRANSLATIONS['en']; }
function updateUILanguage(lang) {
  const t = getLangObj(lang);
  document.querySelector('.label-home').textContent = t.home;
  document.querySelector('.label-more').textContent = t.more;
  document.querySelector('.label-powered').textContent = t.powered;
  document.querySelector('.label-claim').textContent = t.claim;
  document.querySelector('.label-boost').textContent = t.boost;
  document.querySelector('.label-language').textContent = t.language;
  document.querySelector('.label-invite').textContent = t.invite;
  document.querySelector('.label-myid').textContent = t.myid;
  document.querySelector('.label-support').textContent = t.support;
  document.querySelector('.label-legal').textContent = t.legal;
  document.querySelector('.label-select-language').textContent = t.selectLanguage;
  document.querySelector('.label-hashrate').textContent = t.hashrate;
  document.querySelector('.label-userid').textContent = t.userid;
  document.querySelector('.label-contact-support').textContent = t.contactSupport;
  document.querySelector('.label-legal-info').textContent = t.legalInfo;
  document.querySelector('.label-send').textContent = t.send;
  const activeLang = LANGUAGES.find(l => l.code === lang) || LANGUAGES[0];
  document.getElementById('activeLanguageIcon').innerHTML = `<img src="https://flagcdn.com/${activeLang.flag}" width="16"/> ${activeLang.name}`;
}
function openLanguageModal() {
  const modal = document.getElementById("languageModal");
  const langList = document.getElementById("langList");
  langList.innerHTML = "";
  const currentLang = localStorage.getItem("gameLang") || "en";
  LANGUAGES.forEach(lang => {
    const div = document.createElement("div");
    div.className = "lang-item" + (lang.code === currentLang ? " selected" : "");
    div.onclick = () => selectLanguage(lang.code);
    div.innerHTML = `<img class="lang-flag" src="https://flagcdn.com/${lang.flag}"/> ${lang.name}`;
    langList.appendChild(div);
  });
  modal.style.display = "flex";
}
function closeLanguageModal() { document.getElementById("languageModal").style.display = "none"; }
function selectLanguage(code) {
  localStorage.setItem("gameLang", code);
  updateUILanguage(code);
  closeLanguageModal();
}
let userId = localStorage.getItem("userId");
if (!userId) { userId = Math.floor(Math.random() * 1e10).toString(); localStorage.setItem("userId", userId); }
let walletBalance = parseFloat(localStorage.getItem("walletBalance")) || 0;
let miningBalance = parseFloat(localStorage.getItem("miningBalance")) || 0;
let hashrate = parseInt(localStorage.getItem("hashrate")) || 2;
const miningRate = 0.00000009110;
function getUrlParam(name) {
  const match = window.location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
  return match ? decodeURIComponent(match[1]) : null;
}
function handleReferralOnFirstVisit() {
  if (!localStorage.getItem("refHandled")) {
    const ref = getUrlParam("start");
    if (ref && ref !== userId) {
      localStorage.setItem("referrer", ref);
      let friends = JSON.parse(localStorage.getItem("friends_" + ref) || "[]");
      if (!friends.includes(userId)) {
        friends.push(userId);
        localStorage.setItem("friends_" + ref, JSON.stringify(friends));
      }
      walletBalance += 100;
      localStorage.setItem("walletBalance", walletBalance.toString());
      document.getElementById("invite-success-msg").textContent = "Welcome Bonus Received! (100 IND.coin)";
      let inviterBalance = parseFloat(localStorage.getItem("walletBalance_" + ref)) || 0;
      inviterBalance += 5000;
      localStorage.setItem("walletBalance_" + ref, inviterBalance.toString());
      localStorage.setItem("refHandled", "yes");
    }
  }
}
handleReferralOnFirstVisit();
function updateCoinRotationSpeed() {
    let base = 2.8;
    let speed = hashrate > 0 ? base * (2 / hashrate) : base;
    if(speed < 0.28) speed = 0.28;
    if(speed > 5) speed = 5;
    document.getElementById("fanImage").style.setProperty('--rot-speed', speed + "s");
}
function updateMiningDisplay() {
  if(document.getElementById('balance-card')) document.getElementById('balance-card').innerHTML = `Balance: <strong>${walletBalance.toFixed(6)} IND.COIN</strong>`;
  if(document.getElementById('live-balance')) document.getElementById('live-balance').innerText = `${miningBalance.toFixed(9)} IND.coin`;
  if(document.getElementById('hashrate-display')) document.getElementById('hashrate-display').innerText = hashrate;
  if(document.getElementById("userId")) document.getElementById("userId").innerText = userId;
  if(document.getElementById("userId2")) document.getElementById("userId2").innerText = userId;
  updateCoinRotationSpeed();
}
function mineCoins() {
  miningBalance += hashrate * miningRate;
  localStorage.setItem("miningBalance", miningBalance.toString());
  updateMiningDisplay();
}
function startAutoMining() {
  setInterval(mineCoins, 1000);
}
function startApp() {
  document.getElementById("splash-screen").style.display = "none";
  document.querySelectorAll(".tab-content").forEach(tab => tab.style.display = "none");
  document.getElementById("home").style.display = "block";
  document.querySelector(".tab-bar").style.display = "flex";
  updateMiningDisplay();
  showNotif("🎉 Full Update Complete! Enjoy Mining. 🎉");
  startAutoMining();
}
document.getElementById("startGameBtn").onclick = function() {
  var photo = document.getElementById("splashPhoto");
  photo.classList.add("rotate");
  this.disabled = true;
  this.style.opacity = 0.5;
  setTimeout(function() {
    photo.classList.remove("rotate");
    startApp();
  }, 2500);
};
function showTab(tabId) {
  document.querySelectorAll(".tab-content").forEach(tab => tab.style.display = "none");
  document.getElementById(tabId).style.display = "block";
  document.querySelectorAll(".tab-button").forEach(btn => btn.classList.remove("active"));
  const clickedButton = document.getElementById('btn-' + tabId);
  if (clickedButton) clickedButton.classList.add("active");
  updateMiningDisplay();
}
document.getElementById('claimBtn').onclick = function() {
  if (miningBalance > 0) {
    walletBalance += miningBalance;
    miningBalance = 0;
    localStorage.setItem("walletBalance", walletBalance.toString());
    localStorage.setItem("miningBalance", miningBalance.toString());
    updateMiningDisplay();
    document.getElementById("invite-success-msg").textContent = "";
    showNotif("Successfully Claimed!");
  } else {
    showNotif("No IND.coin available to claim.");
  }
};
let boostActive = false;
let origHashrate = hashrate;
document.getElementById('boostBtn').onclick = function() {
  if(boostActive) { showNotif("Boost already active!"); return; }
  boostActive = true;
  origHashrate = hashrate;
  hashrate = Math.round(hashrate * 2.5);
  localStorage.setItem("hashrate", hashrate.toString());
  updateMiningDisplay();
  showNotif("🚀 Boost Activated! x2.5 Hashrate for 20s");
  setTimeout(()=>{
    hashrate = origHashrate;
    localStorage.setItem("hashrate", hashrate.toString());
    updateMiningDisplay();
    showNotif("Boost Ended.");
    boostActive = false;
  }, 20000);
};

        <button style="margin-left:7px;background:#FFD700;color:#fff;border:none;border-radius:5px;padding:5px 12px;cursor:pointer;font-size:13px;" onclick="navigator.clipboard.writeText('${inviteLink}');showNotif('Invite link copied!');">Copy</button>

function openFriendListModal() {
  const modal = document.getElementById("friendListModal");
  const area = document.getElementById("friendListArea");
  let friends = JSON.parse(localStorage.getItem("friends_" + userId) || "[]");
  if (friends.length === 0) {
    area.innerHTML = "<i>No friends invited yet.</i>";
  } else {
    area.innerHTML = "<b>Invited User IDs:</b><br>" + friends.map(fid => `<div style="margin:8px 0;background:#ffd70022;padding:6px 12px;border-radius:7px;display:inline-block;">${fid}</div>`).join("");
  }
  modal.style.display = "flex";
}
function closeFriendListModal() { document.getElementById("friendListModal").style.display = "none"; }
function openLegalModal() { document.getElementById("legalModal").style.display = "flex"; }
function closeLegalModal() { document.getElementById("legalModal").style.display = "none"; }
function openSupportModal() {
  const modal = document.getElementById("supportModal");
  const chatArea = document.getElementById("chatArea");
  chatArea.innerHTML = `<div style="align-self:flex-start;background:#FFD70022;padding:8px 13px;border-radius:8px 8px 8px 2px;color:#B07B00;max-width:90%"><b>AI Support (IND.Coin):</b><br>Hi! How can I help you with your IND.Coin problem?</div>`;
  modal.style.display = "flex";
  setTimeout(()=>{document.getElementById("supportInput").focus()}, 200);
}
function closeSupportModal() { document.getElementById("supportModal").style.display = "none"; }
function sendSupportMessage() {
  const input = document.getElementById("supportInput");
  const chatArea = document.getElementById("chatArea");
  const userMsg = input.value.trim();
  if (userMsg === "") return;
  chatArea.innerHTML += `<div style="align-self:flex-end;background:#FFD700;color:#fff;padding:8px 13px;border-radius:8px 8px 2px 8px;max-width:90%"><b>You:</b><br>${userMsg}</div>`;
  input.value = "";
  chatArea.scrollTop = chatArea.scrollHeight;
  setTimeout(()=>{
    chatArea.innerHTML += `<div style="align-self:flex-start;background:#FFD70022;padding:8px 13px;border-radius:8px 8px 8px 2px;color:#B07B00;max-width:90%"><b>AI Support (IND.Coin):</b><br>Thank you for contacting support. We'll help you with: <i>${userMsg}</i></div>`;
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 600);
}
function showNotif(msg) {
  const pop = document.getElementById("notifPopup");
  pop.innerHTML = msg;
  pop.style.display = "block";
  setTimeout(() => {pop.style.display = "none";}, 2200);
}
function copyMyId() {
  navigator.clipboard.writeText(userId);
  showNotif("Your ID copied!");
}

];

document.addEventListener("DOMContentLoaded", function() {
  let lang = localStorage.getItem("gameLang") || "en";

  updateMiningDisplay();
  document.getElementById("notificationTap").onclick = openNotificationModal;
});
document.getElementById("notificationModal").onclick = function(e){

};

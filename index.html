<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IND.Coin Game</title>
  <link rel="icon" href="https://i.ibb.co/C38bkf7H/IMG-20250622-032411-164.webp" type="image/png">
  <style>
    html, body {min-height:100vh; width:100vw; margin:0; padding:0; box-sizing:border-box; overflow-x:hidden; background:linear-gradient(120deg,#FFD700 0%,#FFA600 100%);background-size:200% 200%;animation:moveBg 12s linear infinite alternate;}
    @keyframes moveBg {0%{background-position:0% 0%;}100%{background-position:100% 100%;}}
    body{font-family:'Segoe UI',Arial,sans-serif;color:#7b5600;}
    #splash-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#FFD700 0%,#FFA600 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10000;}
    @keyframes rotate3d { 0% { transform: rotateY(0deg) rotateZ(0deg);} 100% { transform: rotateY(360deg) rotateZ(360deg);}}
    .fan-image{
      animation: rotate3d 2.8s linear infinite;
      box-shadow: 0 2px 22px #FFD70099, 0 3px 18px #FFA60055, 0 0 0 12px #fffbe6cc;
      perspective: 400px;
      width:124px;height:124px;margin:18px auto 8px;
      border-radius:50%;
      background-image:url('https://i.ibb.co/C38bkf7H/IMG-20250622-032411-164.webp');
      background-size:cover;background-position:center;
      border:4px solid #FFD700;cursor:pointer;
      transition: animation-duration 0.2s;
    }
    .fan-image.fast-spin {animation-duration: 0.93s !important;}
    .welcome-photo{width:108px;height:108px;border-radius:50%;margin-bottom:38px;object-fit:cover;background:#fff;box-shadow:0 2px 22px #FFD70099,0 3px 18px #FFA60055,0 0 0 12px #fffbe6cc;transition: box-shadow 0.2s, transform 0.15s;perspective: 400px;}
    .welcome-photo.rotate {animation: rotate3d 1.25s linear infinite;}
    .splash-title-btn {color:#FFD700;letter-spacing:1px;font-size:2.1em;font-weight:800;cursor:pointer;padding:10px 32px;border-radius:16px;transition:background 0.2s, box-shadow 0.2s;box-shadow:0 2px 24px #FFD70033;user-select:none;border:none;background:linear-gradient(90deg,#fffbe6 70%,#FFD700 100%);outline:none;margin-bottom:8px;}
    .splash-title-btn:active, .splash-title-btn:hover {background:linear-gradient(90deg,#FFD700 70%,#FFA600 100%);color:#B07B00;}
    .tab-bar{display:flex;justify-content:space-around;background:linear-gradient(90deg,#FFD700 60%,#FFA600 100%);border-top:2px solid #FFD700;padding:4px 0 2px 0;position:fixed;left:0;bottom:62px;width:100vw;height:62px;z-index:1000;box-shadow:0 -6px 22px #FFD70055, 0 2px 22px #fffbe6bb inset;backdrop-filter: blur(3px);margin-bottom:0;}
    .tab-button{background:none;border:none;border-radius:10px;color:#7b5600;font-size:13px;display:flex;flex-direction:column;align-items:center;flex:1;height:58px;font-weight:600;}
    .tab-button.active{background:linear-gradient(90deg,#ffe68c 80%,#FFD700 100%);color:#FFA600;}
    .bar-custom-icon{width:22px;height:22px;border-radius:50%;box-shadow:0 0 8px 2px #FFD700,0 2px 7px #FFA60044;background:#fff;border:2px solid #FFD700;margin-bottom:2px;object-fit:cover;}
    .centered{max-width:480px;margin:0 auto;padding:18px 18px 8px 18px;text-align:center;background:linear-gradient(120deg,#fffbe6cc 60%,#ffd70011 100%);border-radius:18px;}
    .balance-card{margin:18px auto 12px;padding:13px 22px;max-width:310px;font-size:19px;border-radius:14px;background:linear-gradient(90deg,#FFD700 65%,#FFA600 100%);color:#7b5600;font-weight:700;}
    .tfun-btn{background:linear-gradient(120deg,#fffbe6 85%,#FFE066 100%);color:#B07B00;font-size:15px;font-weight:700;padding:11px 28px;border:2.2px solid #FFD700;border-radius:10px;display:flex;align-items:center;gap:7px;cursor:pointer;margin-bottom:7px;}
    .tfun-btn img{filter:grayscale(0) brightness(1) sepia(1) hue-rotate(-30deg) saturate(5) brightness(1.3);}
    .more-options{padding:0 2px;display:flex;flex-direction:column;gap:14px;margin-top:16px;}
    .ind-footer{width:100vw;background:linear-gradient(90deg,#FFD700 70%,#FFA600 100%);color:#7b5600;text-align:center;font-size:15px;padding:16px 0 18px 0;font-weight:700;position:fixed;left:0;bottom:0;z-index:999;letter-spacing:0.3px;box-shadow:0 -2px 10px #FFD70022, 0 3px 12px #fffbe6bb inset;pointer-events:none;user-select:none;}
    .footer-logo{width:24px;height:24px;vertical-align:middle;border-radius:50%;margin-left:7px;object-fit:cover;}
    .tab-content{min-height:calc(100vh - 124px);padding:0 0 92px 0;background:linear-gradient(120deg,#FFFBE6 0%,#FFD70011 100%);}
    .button-row{display:flex;flex-wrap:wrap;justify-content:center;gap:13px;margin:20px 0 24px;}
    #invite-success-msg { color: #388e3c; font-weight:bold; font-size:15px; margin:12px 0 0 0; }
    #supportModal, #legalModal, #languageModal, #friendListModal {display:none;position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:999999;background:rgba(0,0,0,0.18);align-items:center;justify-content:center;}
    #supportModal > div, #legalModal > div, #languageModal > div, #friendListModal > div {background:#fffbe6;max-width:340px;width:95vw;border-radius:14px;box-shadow:0 4px 18px #FFD70066;padding:0;display:flex;flex-direction:column;}
    .lang-list{padding:24px 18px 18px 18px;display:flex;flex-direction:column;gap:10px;}
    .lang-item{display:flex;align-items:center;gap:13px;background:#ffe06633;padding:10px 13px;border-radius:8px;cursor:pointer;font-size:16px;transition:background 0.18s;}
    .lang-item.selected,.lang-item:hover{background:linear-gradient(90deg,#FFD700 60%,#FFA600 100%);color:#B07B00;}
    .lang-flag{width:22px;height:22px;border-radius:4px;object-fit:cover;border:1px solid #FFD700;}
    @media (max-width:650px){
      .centered,.balance-card{max-width:98vw;}
      .tab-bar{height:62px;}
      .ind-footer{font-size:13px;}
      #supportModal > div, #legalModal > div, #languageModal > div, #friendListModal > div {max-width:98vw;}
    }
  </style>
</head>
<body>
<!-- Splash Screen -->
<div id="splash-screen">
  <img src="https://i.ibb.co/C38bkf7H/IMG-20250622-032411-164.webp" alt="Welcome" class="welcome-photo" id="splashPhoto" />
  <button class="splash-title-btn" id="startGameBtn">
    IND.Coin
  </button>
</div>
<!-- Home Tab -->
<div id="home" class="tab-content" style="display:none;">
  <div class="centered">
    <div class="balance-card" id="balance-card">
      Balance: <strong>0.000000 IND.COIN</strong>
    </div>
    <div class="fan-image" id="fanImage"></div>
    <div style="font-size:16px;margin-bottom:5px;color:#B07B00;">
      <span id="live-balance">0.000000000 IND.coin</span>
    </div>
    <div style="font-size:14px;color:#B07B00;">
      <span class="label-hashrate">Hashrate</span>: <span id="hashrate-display">2</span> GH/s ⚡
    </div>
    <div class="button-row">
      <button class="tfun-btn" id="claimBtn" onclick="claimCoins()">
        <img src="https://img.icons8.com/ios-filled/50/FFD700/stack-of-coins.png" width="20" /> <span class="label-claim">Claim</span>
      </button>
      <button class="tfun-btn" onclick="boostHashrate()">
        <img src="https://img.icons8.com/ios-filled/50/FFD700/flash-on.png" width="20" /> <span class="label-boost">Boost</span>
      </button>
    </div>
    <div id="invite-success-msg"></div>
    <div style="margin-top:25px;color:#B07B00;font-size:12px;">
      <span class="label-userid">Your user ID</span>: <span id="userId"></span>
    </div>
  </div>
</div>
<!-- More Tab -->
<div id="more" class="tab-content centered" style="display:none;">
  <div class="centered" style="margin-top:12px;background:#FFFBE6;box-shadow:none;">
    <div class="more-options">
      <button class="tfun-btn" onclick="alert('Your ID copied!')"><img src="https://img.icons8.com/ios-filled/50/FFD700/id-verified.png" width="18"/> <span class="label-myid">My ID</span> <span id="userId2" style="font-weight:600;margin-left:auto;">Loading...</span></button>
      <button class="tfun-btn" onclick="openInviteModal()"><img src="https://img.icons8.com/ios-filled/50/FFD700/add-user-group-man-man--v1.png" width="18" /> <span class="label-invite">Invite Friend</span></button>
      <button class="tfun-btn" onclick="openFriendListModal()"><img src="https://img.icons8.com/ios-filled/50/FFD700/group-foreground-selected.png" width="18"/> Friend List</button>
      <button class="tfun-btn" onclick="openLanguageModal()"><img src="https://img.icons8.com/ios-filled/50/FFD700/language.png" width="18"/> <span class="label-language">Language</span> <span id="activeLanguageIcon" style="margin-left:auto;"><img src="https://flagcdn.com/us.svg" width="16"/> English</span></button>
      <button class="tfun-btn" onclick="openSupportModal()"><img src="https://img.icons8.com/ios-filled/50/FFD700/help.png" width="18"/> <span class="label-support">Support</span></button>
      <button class="tfun-btn" onclick="openLegalModal()"><img src="https://img.icons8.com/ios-filled/50/FFD700/legal.png" width="18"/> <span class="label-legal">Legal Info</span></button>
    </div>
  </div>
</div>
<!-- Tab Bar -->
<div class="tab-bar" style="display:none;">
  <button onclick="showTab('home')" class="tab-button active" id="btn-home">
    <img src="https://i.ibb.co/C38bkf7H/IMG-20250622-032411-164.webp" class="bar-custom-icon"/>
    <span class="label-home">Home</span>
  </button>
  <button onclick="showTab('more')" class="tab-button" id="btn-more">
    <img src="https://i.ibb.co/C38bkf7H/IMG-20250622-032411-164.webp" class="bar-custom-icon"/>
    <span class="label-more">More</span>
  </button>
</div>
<!-- Footer -->
<div class="ind-footer">
  <span class="label-powered">Powered by</span> <b>IND.coin</b>
  <img src="https://i.ibb.co/C38bkf7H/IMG-20250622-032411-164.webp" class="footer-logo" alt="IND.COIN Logo">
</div>
<!-- Support Modal -->
<div id="supportModal">
  <div>
    <div style="padding:18px 14px 12px 14px;border-bottom:1.5px solid #FFD700;">
      <b style="font-size:1.15em;color:#B07B00;" class="label-contact-support">Contact Support</b>
      <button onclick="closeSupportModal()" style="float:right;background:transparent;border:none;font-size:23px;cursor:pointer;color:#FFD700;">&times;</button>
    </div>
    <div id="chatArea" style="padding:14px 12px;min-height:120px;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:15px;"></div>
    <div style="padding:12px;border-top:1.5px solid #FFD700;display:flex;gap:6px;">
      <input id="supportInput" type="text" placeholder="Type your IND.Coin issue..." style="flex:1;padding:7px 10px;border-radius:7px;border:1.5px solid #FFD700;font-size:15px;" onkeydown="if(event.key==='Enter'){sendSupportMessage();}">
      <button onclick="sendSupportMessage()" style="background:#FFD700;color:#fff;padding:7px 18px;border-radius:7px;border:none;font-size:15px;font-weight:700;cursor:pointer;" class="label-send">Send</button>
    </div>
  </div>
</div>
<!-- Legal Modal -->
<div id="legalModal">
  <div>
    <div style="padding:18px 14px 12px 14px;border-bottom:1.5px solid #FFD700;">
      <b style="font-size:1.15em;color:#B07B00;" class="label-legal-info">Legal Info</b>
      <button onclick="closeLegalModal()" style="float:right;background:transparent;border:none;font-size:23px;cursor:pointer;color:#FFD700;">&times;</button>
    </div>
    <div style="padding:24px 22px 20px 22px; display:flex; flex-direction:column; gap:22px; align-items:center;">
      <button style="width:100%;background:linear-gradient(90deg,#FFD700 60%,#FFA600 100%);color:#B07B00;font-size:17px;font-weight:700;padding:13px 12px;border-radius:10px;border:2px solid #FFD700;cursor:pointer;" onclick="window.open('https://t.me/+_J-uxL38oSo3NDI1','_blank')">Channel 1 (Chanchal 1)</button>
      <button style="width:100%;background:linear-gradient(90deg,#FFE066 60%,#FFD700 100%);color:#B07B00;font-size:17px;font-weight:700;padding:13px 12px;border-radius:10px;border:2px solid #FFD700;cursor:pointer;" onclick="window.open('https://t.me/+Lki3cyjdtb9kNDNl','_blank')">Chanchal 2</button>
    </div>
  </div>
</div>
<!-- Language Modal -->
<div id="languageModal">
  <div>
    <div style="padding:18px 14px 12px 14px;border-bottom:1.5px solid #FFD700;">
      <b style="font-size:1.15em;color:#B07B00;" class="label-select-language">Select Language</b>
      <button onclick="closeLanguageModal()" style="float:right;background:transparent;border:none;font-size:23px;cursor:pointer;color:#FFD700;">&times;</button>
    </div>
    <div class="lang-list" id="langList"></div>
  </div>
</div>
<!-- Friend List Modal -->
<div id="friendListModal">
  <div>
    <div style="padding:18px 14px 12px 14px;border-bottom:1.5px solid #FFD700;">
      <b style="font-size:1.15em;color:#B07B00;">My Friend List</b>
      <button onclick="closeFriendListModal()" style="float:right;background:transparent;border:none;font-size:23px;cursor:pointer;color:#FFD700;">&times;</button>
    </div>
    <div id="friendListArea" style="padding:20px 12px;min-height:100px;max-height:220px;overflow:auto;font-size:15px;text-align:left;"></div>
  </div>
</div>
<script>
const LANGUAGES = [
  {code:"en", name:"English",   flag:"us.svg"},
  {code:"hi", name:"हिन्दी",     flag:"in.svg"},
  {code:"es", name:"Español",   flag:"es.svg"},
  {code:"fr", name:"Français",  flag:"fr.svg"},
  {code:"de", name:"Deutsch",   flag:"de.svg"},
  {code:"zh", name:"中文",       flag:"cn.svg"},
  {code:"ar", name:"العربية",   flag:"sa.svg"},
  {code:"ru", name:"Русский",   flag:"ru.svg"},
  {code:"ja", name:"日本語",    flag:"jp.svg"},
  {code:"tr", name:"Türkçe",    flag:"tr.svg"},
  {code:"pt", name:"Português", flag:"pt.svg"},
  {code:"bn", name:"বাংলা",     flag:"bd.svg"},
  {code:"id", name:"Bahasa Indonesia", flag:"id.svg"},
  {code:"ko", name:"한국어",    flag:"kr.svg"},
  {code:"vi", name:"Tiếng Việt", flag:"vn.svg"},
  {code:"fa", name:"فارسی",      flag:"ir.svg"},
];
const TRANSLATIONS = {
  en: {
    home: "Home", more: "More", powered: "Powered by", claim: "Claim", boost: "Boost", language: "Language",
    invite: "Invite Friend", myid: "My ID", support: "Support", legal: "Legal Info", selectLanguage: "Select Language",
    hashrate: "Hashrate", userid: "Your user ID", contactSupport: "Contact Support", legalInfo: "Legal Info",
    send: "Send"
  },
  hi: { home:"मुख्य", more:"अधिक", powered:"द्वारा संचालित", claim:"क्लेम करें", boost:"बूस्ट", language:"भाषा", invite:"मित्र आमंत्रित करें", myid:"मेरी आईडी", support:"सहायता", legal:"कानूनी जानकारी", selectLanguage:"भाषा चुनें", hashrate:"हैशरेट", userid:"आपकी यूज़र आईडी", contactSupport:"संपर्क सहायता", legalInfo:"कानूनी जानकारी", send:"भेजें" },
  es: { home:"Inicio", more:"Más", powered:"Desarrollado por", claim:"Reclamar", boost:"Impulsar", language:"Idioma", invite:"Invitar amigo", myid:"Mi ID", support:"Soporte", legal:"Información legal", selectLanguage:"Seleccionar idioma", hashrate:"Potencia", userid:"Tu ID de usuario", contactSupport:"Contactar soporte", legalInfo:"Información legal", send:"Enviar" },
  fr: { home:"Accueil", more:"Plus", powered:"Propulsé par", claim:"Réclamer", boost:"Booster", language:"Langue", invite:"Inviter un ami", myid:"Mon ID", support:"Support", legal:"Infos légales", selectLanguage:"Choisir la langue", hashrate:"Taux de hachage", userid:"Votre ID utilisateur", contactSupport:"Contacter le support", legalInfo:"Infos légales", send:"Envoyer" },
  de: { home:"Start", more:"Mehr", powered:"Angetrieben von", claim:"Beanspruchen", boost:"Boost", language:"Sprache", invite:"Freund einladen", myid:"Meine ID", support:"Support", legal:"Rechtliches", selectLanguage:"Sprache wählen", hashrate:"Hashrate", userid:"Ihre Benutzer-ID", contactSupport:"Support kontaktieren", legalInfo:"Rechtliches", send:"Senden" }
};
function getLangObj(code) {
  return TRANSLATIONS[code] || TRANSLATIONS['en'];
}
function updateUILanguage(lang) {
  const t = getLangObj(lang);
  document.querySelector('.label-home').textContent = t.home;
  document.querySelector('.label-more').textContent = t.more;
  document.querySelector('.label-powered').textContent = t.powered;
  document.querySelector('.label-claim').textContent = t.claim;
  document.querySelector('.label-boost').textContent = t.boost;
  document.querySelector('.label-language').textContent = t.language;
  document.querySelector('.label-invite').textContent = t.invite;
  document.querySelector('.label-myid').textContent = t.myid;
  document.querySelector('.label-support').textContent = t.support;
  document.querySelector('.label-legal').textContent = t.legal;
  document.querySelector('.label-select-language').textContent = t.selectLanguage;
  document.querySelector('.label-hashrate').textContent = t.hashrate;
  document.querySelector('.label-userid').textContent = t.userid;
  document.querySelector('.label-contact-support').textContent = t.contactSupport;
  document.querySelector('.label-legal-info').textContent = t.legalInfo;
  document.querySelector('.label-send').textContent = t.send;
  const activeLang = LANGUAGES.find(l => l.code === lang) || LANGUAGES[0];
  document.getElementById('activeLanguageIcon').innerHTML = `<img src="https://flagcdn.com/${activeLang.flag}" width="16"/> ${activeLang.name}`;
}
function openLanguageModal() {
  const modal = document.getElementById("languageModal");
  const langList = document.getElementById("langList");
  langList.innerHTML = "";
  const currentLang = localStorage.getItem("gameLang") || "en";
  LANGUAGES.forEach(lang => {
    const div = document.createElement("div");
    div.className = "lang-item" + (lang.code === currentLang ? " selected" : "");
    div.onclick = () => selectLanguage(lang.code);
    div.innerHTML = `<img class="lang-flag" src="https://flagcdn.com/${lang.flag}"/> ${lang.name}`;
    langList.appendChild(div);
  });
  modal.style.display = "flex";
}
function closeLanguageModal() { document.getElementById("languageModal").style.display = "none"; }
function selectLanguage(code) {
  localStorage.setItem("gameLang", code);
  updateUILanguage(code);
  closeLanguageModal();
}

// --- Main Game Logic ---
let userId = localStorage.getItem("userId");
if (!userId) { userId = Math.floor(Math.random() * 1e10).toString(); localStorage.setItem("userId", userId); }
let walletBalance = parseFloat(localStorage.getItem("walletBalance")) || 0;
let miningBalance = parseFloat(localStorage.getItem("miningBalance")) || 0;
let hashrate = parseInt(localStorage.getItem("hashrate")) || 2;
const miningRate = 0.00000009110;

// --- Referral/Invite logic ---
function getUrlParam(name) {
  const match = window.location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
  return match ? decodeURIComponent(match[1]) : null;
}
function handleReferralOnFirstVisit() {
  if (!localStorage.getItem("refHandled")) {
    const ref = getUrlParam("start");
    if (ref && ref !== userId) {
      localStorage.setItem("referrer", ref);
      let friends = JSON.parse(localStorage.getItem("friends_" + ref) || "[]");
      if (!friends.includes(userId)) {
        friends.push(userId);
        localStorage.setItem("friends_" + ref, JSON.stringify(friends));
      }
      walletBalance += 100;
      localStorage.setItem("walletBalance", walletBalance.toString());
      document.getElementById("invite-success-msg").textContent = "Welcome Bonus Received! (100 IND.coin)";
      let inviterBalance = parseFloat(localStorage.getItem("walletBalance_" + ref)) || 0;
      inviterBalance += 5000;
      localStorage.setItem("walletBalance_" + ref, inviterBalance.toString());
      localStorage.setItem("refHandled", "yes");
    }
  }
}
handleReferralOnFirstVisit();

function updateMiningDisplay() {
  if(document.getElementById('balance-card')) document.getElementById('balance-card').innerHTML = `Balance: <strong>${walletBalance.toFixed(6)} IND.COIN</strong>`;
  if(document.getElementById('live-balance')) document.getElementById('live-balance').innerText = `${miningBalance.toFixed(9)} IND.coin`;
  if(document.getElementById('hashrate-display')) document.getElementById('hashrate-display').innerText = hashrate;
  if(document.getElementById("userId")) document.getElementById("userId").innerText = userId;
  if(document.getElementById("userId2")) document.getElementById("userId2").innerText = userId;
  if(document.getElementById('wallet-balance-card')) document.getElementById('wallet-balance-card').innerHTML = `Assets Balance: <strong>${walletBalance.toFixed(6)} IND.COIN</strong>`;
}
function mineCoins() {
  miningBalance += hashrate * miningRate;
  localStorage.setItem("miningBalance", miningBalance.toString());
  updateMiningDisplay();
}
function startAutoMining() {
  setInterval(mineCoins, 1000);
}
function startApp() {
  document.getElementById("splash-screen").style.display = "none";
  document.querySelectorAll(".tab-content").forEach(tab => tab.style.display = "none");
  document.getElementById("home").style.display = "block";
  document.querySelector(".tab-bar").style.display = "flex";
  updateMiningDisplay();
  startAutoMining();
}
document.getElementById("startGameBtn").onclick = function() {
  var photo = document.getElementById("splashPhoto");
  photo.classList.add("rotate");
  this.disabled = true;
  this.style.opacity = 0.5;
  setTimeout(function() {
    photo.classList.remove("rotate");
    startApp();
  }, 5000);
};
// FAN SPIN LOGIC (ONLY IMAGE FAST, GH/S NORMAL)
const fanImage = document.getElementById("fanImage");
let fanTimeout = null;
fanImage.addEventListener("click", function() {
  fanImage.classList.add("fast-spin");
  if (fanTimeout) clearTimeout(fanTimeout);
  fanTimeout = setTimeout(function() {
    fanImage.classList.remove("fast-spin");
  }, 6000); // 6 seconds
});

function showTab(tabId) {
  document.querySelectorAll(".tab-content").forEach(tab => tab.style.display = "none");
  document.getElementById(tabId).style.display = "block";
  document.querySelectorAll(".tab-button").forEach(btn => btn.classList.remove("active"));
  const clickedButton = document.getElementById('btn-' + tabId);
  if (clickedButton) clickedButton.classList.add("active");
  updateMiningDisplay();
}
function claimCoins() {
  if (miningBalance > 0) {
    walletBalance += miningBalance;
    miningBalance = 0;
    localStorage.setItem("walletBalance", walletBalance.toString());
    localStorage.setItem("miningBalance", miningBalance.toString());
    updateMiningDisplay();
    alert("Successfully Claimed!");
  } else {

function openFriendListModal() {
  const modal = document.getElementById("friendListModal");
  const area = document.getElementById("friendListArea");

  if (friends.length === 0) {
    area.innerHTML = "<i>No friends invited yet.</i>";
  } else {
    area.innerHTML = "<b>Invited User IDs:</b><br>" + friends.map(fid => `<div style="margin:8px 0;background:#ffd70022;padding:6px 12px;border-radius:7px;display:inline-block;">${fid}</div>`).join("");
  }
  modal.style.display = "flex";

function sendSupportMessage() {
  const input = document.getElementById("supportInput");
  const chatArea = document.getElementById("chatArea");
  const userMsg = input.value.trim();
  if (userMsg === "") return;
  chatArea.innerHTML += `<div style="align-self:flex-end;background:#FFD700;color:#fff;padding:8px 13px;border-radius:8px 8px 2px 8px;max-width:90%"><b>You:</b><br>${userMsg}</div>`;
  input.value = "";
  chatArea.scrollTop = chatArea.scrollHeight;
  setTimeout(()=>{
    chatArea.innerHTML += `<div style="align-self:flex-start;background:#FFD70022;padding:8px 13px;border-radius:8px 8px 8px 2px;color:#B07B00;max-width:90%"><b>AI Support (IND.Coin):</b><br>Thank you for contacting support. We'll help you with: <i>${userMsg}</i></div>`;
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 600);
}
